# =============================================================================
# nginx.conf — proxy reverso ALTERNATIVO ao Caddy
# =============================================================================
# Use este arquivo se a máquina já roda nginx (ou se a política da hospedagem
# exigir). O Caddy (deploy/Caddyfile) continua sendo o recomendado: emite e
# renova o certificado sozinho e dispensa o certbot.
#
# Instalação sugerida (Debian/Ubuntu):
#   apt install nginx certbot
#   cp deploy/nginx.conf /etc/nginx/sites-available/lola
#   ln -s /etc/nginx/sites-available/lola /etc/nginx/sites-enabled/lola
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d loja.seudominio.com.br
#   nginx -t && systemctl reload nginx
#   # renovação automática já vem com o timer do certbot:
#   systemctl enable --now certbot.timer
#
# Troque `loja.seudominio.com.br` pelo domínio real.
#
# -----------------------------------------------------------------------------
# REGRAS (as mesmas do Caddyfile)
# -----------------------------------------------------------------------------
# 1. TODO o tráfego vai para a VITRINE em 127.0.0.1:3000.
# 2. NADA aponta para o servidor de dados — no modo dividido ele não tem porta
#    publicada e não deve ganhar uma.
# 3. O painel administrativo é bloqueado na porta pública (bloco 403 abaixo).
# 4. X-Forwarded-For é repassado; sem `LOLA_TRUSTED_PROXY` declarado no `.env`,
#    a aplicação IGNORA esse cabeçalho e lê como IP da cliente o endereço do
#    socket — todo mundo cai no MESMO balde de rate limit e um único atacante
#    derruba o checkout de todas as clientes.
# =============================================================================

upstream lola_vitrine {
	# Só a vitrine. O servidor de dados NUNCA entra aqui.
	server 127.0.0.1:3000;
	keepalive 16;
}

# -----------------------------------------------------------------------------
# 1) HTTP -> HTTPS (com o desafio ACME do Let's Encrypt por fora do redirect)
# -----------------------------------------------------------------------------
server {
	listen 80;
	listen [::]:80;
	server_name loja.seudominio.com.br;

	# Desafio de renovação NÃO pode ser redirecionado: o certbot precisa
	# conseguir ler /.well-known/acme-challenge/ por HTTP.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
	}

	# Redireciona o resto para HTTPS. `always` inclui respostas 4xx/5xx.
	location / {
		return 301 https://$host$request_uri;
	}
}

# -----------------------------------------------------------------------------
# 2) HTTPS — a loja
# -----------------------------------------------------------------------------
server {
	listen 443 ssl;
	# `listen ... http2` é a sintaxe que funciona do nginx 1.9 até hoje
	# (a partir da 1.25 ela só emite aviso de depreciação). Se a sua versão
	# for >= 1.25 e preferir, troque por `listen 443 ssl;` + `http2 on;`.
	listen [::]:443 ssl http2;
	server_name loja.seudominio.com.br;

	# Certificados do Let's Encrypt (renovação automática pelo timer do certbot).
	ssl_certificate     /etc/letsencrypt/live/loja.seudominio.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/loja.seudominio.com.br/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	# OCSP stapling: o navegador confere a revogação sem uma ida extra ao CA.
	ssl_stapling on;
	ssl_stapling_verify on;

	server_tokens off;

	# --- limite de corpo -----------------------------------------------------
	# A API aceita no máximo 16 kB (`express.json({limit:'16kb'})`). 32 kB aqui
	# garante que nenhum pré-pedido legítimo seja cortado pelo proxy e que o
	# 413 venha da aplicação, em JSON, com o mesmo formato de erro de sempre.
	# Abaixo de 16 kB o nginx devolveria um HTML de erro no lugar do JSON.
	client_max_body_size 32k;

	# --- BLOQUEIO DO PAINEL ADMINISTRATIVO NA PORTA PÚBLICA -------------------
	# `^~` tem prioridade sobre o prefixo `/api/`, e `=` vence sobre qualquer
	# outro: estes dois blocos são escolhidos antes de `location /api/` e antes
	# de `location /`, então nada abaixo deles passa.
	#
	# Por que bloquear AQUI e não só na aplicação: a allowlist de origem
	# (LOLA_ADMIN_ALLOWED_IPS) lê o IP do SOCKET, e atrás do proxy esse IP é
	# sempre o mesmo (o próprio proxy). Ou seja, atrás do proxy a aplicação não
	# consegue distinguir a loja de um visitante qualquer — quem separa de
	# verdade é este bloco. O acesso legítimo não passa por este servidor:
	#
	#   modo embutido :
	#     curl -H "x-admin-key: $LOLA_ADMIN_API_KEY" \
	#          http://127.0.0.1:3000/api/admin/pre-pedidos
	#
	#   modo dividido  :
	#     curl -H "x-admin-key: $LOLA_ADMIN_API_KEY" \
	#          http://172.31.1.10:4100/api/admin/pre-pedidos
	#     (ou via túnel SSH: ssh -L 4100:172.31.1.10:4100 user@servidor)
	#
	# Para um teste temporário, troque o 403 por allow/deny em vez de apagar os
	# blocos — e volte ao 403 depois.
	location ^~ /api/admin/ {
		return 403;
	}
	location = /api/estoque/atualizar {
		return 403;
	}

	# Não faz sentido guardar em cache o que é por cliente.
	location /api/ {
		proxy_pass http://lola_vitrine;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;
		# 30s cobre o pior caso da aplicação (consulta ao assistente com
		# timeout de 20s) e evita segurar um socket preso para sempre.
		proxy_connect_timeout 5s;
		proxy_read_timeout    30s;
		proxy_send_timeout    30s;
		# Sem `add_header` aqui de propósito: em nginx, um `add_header` dentro de
		# um `location` anula TODOS os herdados do `server` (inclusive HSTS).
		# `Cache-Control: no-store` em /api/ já vem da própria aplicação.
	}

	# SPA (React) e arquivos estáticos: mesmo destino, com caminho preservado.
	location / {
		proxy_pass http://lola_vitrine;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;
		proxy_connect_timeout 5s;
		proxy_read_timeout    30s;
		proxy_send_timeout    30s;
	}

	# HSTS: navegador passa a exigir HTTPS neste host por 180 dias.
	# A aplicação também envia (LOLA_HSTS_ENABLED, padrão ligado) — valores
	# iguais, cabeçalho duplicado é inofensivo. `always` manda até em erro.
	# Só adicione `; includeSubDomains` quando TODOS os subdomínios já estiverem
	# em HTTPS; senão você quebra o subdomínio pendente pelo período inteiro.
	add_header Strict-Transport-Security "max-age=15552000" always;
	add_header X-Content-Type-Options    "nosniff" always;
	add_header X-Frame-Options           "DENY" always;
}

# -----------------------------------------------------------------------------
# FIM. O bloqueio do painel administrativo ficou DENTRO do bloco 2 (HTTPS),
# porque dois `server` com o mesmo `listen` + `server_name` faria o nginx
# descartar o segundo como "conflicting server name" — ele nunca seria usado.
# -----------------------------------------------------------------------------
