name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# RT-S-09: o job só precisa ler o repositório; sem este bloco o token fica
# com o padrão do repositório.
permissions:
  contents: read

jobs:

  database-schema:
    name: PostgreSQL schema and integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lola_ci
          POSTGRES_USER: lola_ci
          POSTGRES_PASSWORD: ci-only-no-real-database-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lola_ci -d lola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration twice and verify business constraints
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: lola_ci
          PGDATABASE: lola_ci
          PGPASSWORD: ci-only-no-real-database-secret
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/0001_core.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/0001_core.sql
          psql -X -v ON_ERROR_STOP=1 -f db/tests/schema_invariants.sql
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinadas por SHA (RT-S-01): tag móvel muda de conteúdo sem aviso
      # e roda com o token do workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit

      # RT-S-02: a árvore npm do e2e/ tem lockfile próprio e ficaria fora do
      # portão; audit limpo hoje, gate contínuo a partir de agora.
      - name: Dependency audit (e2e)
        run: cd e2e && npm ci && npm audit

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
