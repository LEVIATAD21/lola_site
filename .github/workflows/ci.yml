name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# RT-S-09: o job só precisa ler o repositório; sem este bloco o token fica
# com o padrão do repositório.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinadas por SHA (RT-S-01): tag móvel muda de conteúdo sem aviso
      # e roda com o token do workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit

      # RT-S-02: a árvore npm do e2e/ tem lockfile próprio e ficaria fora do
      # portão; audit limpo hoje, gate contínuo a partir de agora.
      - name: Dependency audit (e2e)
        run: cd e2e && npm ci && npm audit

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
